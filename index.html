<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f9f6f0">
  <title>Form Maria · to Said Moussouni</title>
  <style>
    /* ============================================================
       RESET & GLOBAL
       ============================================================ */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --sage: #b8c4b8;
      --sage-deep: #93a493;
      --cream: #f9f6f0;
      --warm-white: #fdfbf7;
      --beige: #e8e0d5;
      --gold: #c9b38b;
      --gold-light: #e3d5b8;
      --text: #4a4a3f;
      --text-soft: #6b6b5c;
      --shadow: rgba(150, 140, 120, 0.12);
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--cream);
      color: var(--text);
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       SCENE SYSTEM
       ============================================================ */
    .scene {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)) 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s;
      z-index: 1;
      overflow: hidden;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    /* ============================================================
       TYPOGRAPHY
       ============================================================ */
    .title-large {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      font-weight: 400;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
      text-align: center;
    }

    .title-soft {
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 5vw, 2rem);
      font-weight: 400;
      color: var(--text-soft);
      text-align: center;
      line-height: 1.5;
    }

    .subtitle {
      font-size: clamp(0.95rem, 3.5vw, 1.15rem);
      color: var(--text-soft);
      text-align: center;
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    /* Small elegant signature under intro */
    .intro-signature {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(0.85rem, 3.2vw, 1rem);
      color: var(--text-soft);
      letter-spacing: 0.05em;
      opacity: 0.85;
      text-align: center;
      margin-top: -4px;
    }

    .intro-signature .name {
      color: var(--sage-deep);
      font-style: normal;
      letter-spacing: 0.08em;
      font-weight: 500;
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .btn {
      font-family: var(--font-sans);
      font-size: clamp(1rem, 4vw, 1.15rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      padding: 16px 36px;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.25s,
                  background-color 0.25s;
      min-height: 56px;
      min-width: 200px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      position: relative;
      overflow: hidden;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(145deg, var(--sage), var(--sage-deep));
      color: var(--warm-white);
      box-shadow: 0 8px 24px rgba(150, 160, 140, 0.35),
                  0 2px 6px rgba(150, 160, 140, 0.2);
    }

    .btn-primary:hover {
      box-shadow: 0 12px 32px rgba(150, 160, 140, 0.45),
                  0 4px 10px rgba(150, 160, 140, 0.25);
      transform: translateY(-2px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-soft);
      border: 1.5px solid var(--beige);
      font-size: 0.95rem;
      min-width: auto;
      padding: 12px 28px;
      min-height: 48px;
    }

    /* ============================================================
       INTRO SCENE
       ============================================================ */
    #scene-intro .intro-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      text-align: center;
    }

    .intro-heart {
      font-size: 3rem;
      animation: pulseHeart 2.4s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(200, 160, 150, 0.3));
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
    }

    .intro-line {
      width: 60px;
      height: 1px;
      background: var(--gold-light);
      margin: 4px auto;
    }

    /* ============================================================
       MESSAGE SCENE
       ============================================================ */
    #scene-message .message-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 500px;
    }

    .message-main {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 8vw, 3rem);
      color: var(--text);
      line-height: 1.3;
    }

    .message-reveal {
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: var(--text-soft);
      line-height: 1.7;
      min-height: 2.4em;
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* ============================================================
       PHOTOS SCENE
       ============================================================ */
    #scene-photos .photos-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 400px;
    }

    .photo-card {
      width: 100%;
      aspect-ratio: 4 / 5;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(160, 150, 130, 0.25),
                  0 4px 12px rgba(160, 150, 130, 0.15);
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 1s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      background: var(--beige);
      animation: floatPhoto 6s ease-in-out infinite;
    }

    .photo-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .photo-card:nth-child(2) {
      animation-delay: -3s;
    }

    @keyframes floatPhoto {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .photo-card img.img-failed {
      opacity: 0;
    }

    .photo-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: var(--text-soft);
      font-family: var(--font-serif);
      font-size: 0.95rem;
      text-align: center;
      padding: 20px;
      background: linear-gradient(145deg, var(--beige), #d9d0c4);
    }

    .photo-fallback span:first-child {
      font-size: 2rem;
      opacity: 0.6;
    }

    .photo-glow {
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(200, 180, 140, 0.3), transparent, rgba(180, 190, 170, 0.3));
      z-index: -1;
      opacity: 0;
      transition: opacity 0.6s;
    }

    .photo-card.visible .photo-glow {
      opacity: 1;
    }

    /* ============================================================
       ENVELOPE SCENE
       ============================================================ */
    #scene-envelope .envelope-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .envelope-wrapper {
      position: relative;
      width: min(280px, 70vw);
      aspect-ratio: 1.5 / 1;
      perspective: 900px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.4s ease;
    }

    .envelope-wrapper:active {
      transform: scale(0.98);
    }

    .envelope {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #e8e0d5, #d9d0c4);
      border-radius: 6px;
      box-shadow: 0 12px 36px rgba(160, 150, 130, 0.3);
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(180deg, #d9d0c4, #cfc5b8);
      border-radius: 6px 6px 0 0;
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 3;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .envelope-flap.open {
      transform: rotateX(180deg);
    }

    .envelope-body {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(180deg, #d9d0c4, #cfc5b8);
      border-radius: 0 0 6px 6px;
      z-index: 2;
      overflow: hidden;
    }

    .envelope-letter {
      position: absolute;
      bottom: 12%;
      left: 8%;
      width: 84%;
      height: 70%;
      background: var(--warm-white);
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(160, 150, 130, 0.2);
      transform: translateY(40px) scale(0.9);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .envelope-letter.revealed {
      transform: translateY(-70px) scale(1);
      opacity: 1;
      z-index: 4;
    }

    .envelope-seal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #d4c5a8, var(--gold));
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-family: var(--font-serif);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--warm-white);
      box-shadow: 0 2px 8px rgba(180, 160, 120, 0.4);
      transition: opacity 0.5s, transform 0.5s;
    }

    .envelope-seal.hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
    }

    /* ============================================================
       LETTER SCENE
       ============================================================ */
    #scene-letter .letter-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 540px;
      max-height: 85dvh;
    }

    .letter-paper {
      background: var(--warm-white);
      border-radius: 14px;
      padding: 32px 24px;
      box-shadow: 0 16px 48px rgba(160, 150, 130, 0.2),
                  0 2px 8px rgba(160, 150, 130, 0.1);
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      max-height: 68dvh;
      position: relative;
      border: 1px solid rgba(200, 180, 140, 0.15);
    }

    .letter-paper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--sage), var(--gold-light), var(--sage));
      border-radius: 14px 14px 0 0;
    }

    .letter-text {
      font-family: var(--font-serif);
      font-size: clamp(0.95rem, 3.8vw, 1.1rem);
      line-height: 1.9;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .letter-text p {
      margin-bottom: 18px;
    }

    .letter-text .salutation {
      font-size: 1.1em;
      color: var(--text);
      font-style: italic;
    }

    .letter-text .salutation .name {
      font-style: normal;
      color: var(--sage-deep);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .letter-text p:last-child {
      margin-bottom: 0;
    }

    .letter-signature {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(1.05rem, 4.2vw, 1.3rem);
      color: var(--text-soft);
      text-align: right;
      margin-top: 24px;
      line-height: 1.6;
    }

    .letter-signature .sign-name {
      display: block;
      margin-top: 8px;
      font-style: normal;
      color: var(--sage-deep);
      font-size: 0.95em;
      letter-spacing: 0.06em;
      font-weight: 500;
    }

    /* ============================================================
       ENDING SCENE
       ============================================================ */
    #scene-ending .ending-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .ending-photos {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 12px 0;
    }

    .ending-photo {
      width: min(140px, 32vw);
      aspect-ratio: 4 / 5;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(160, 150, 130, 0.25);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s,
                  transform 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s;
      animation: floatPhoto 7s ease-in-out infinite;
      position: relative;
      background: var(--beige);
    }

    .ending-photo:nth-child(2) {
      animation-delay: -3.5s;
    }

    .ending-photo.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .ending-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ending-photo img.img-failed {
      opacity: 0;
    }

    .ending-photo .photo-fallback {
      font-size: 0.8rem;
      padding: 12px;
    }

    .ending-photo .photo-fallback span:first-child {
      font-size: 1.5rem;
    }

    .ending-message {
      font-family: var(--font-serif);
      font-size: clamp(1.2rem, 5vw, 1.8rem);
      color: var(--text);
      line-height: 1.5;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 1s ease 0.6s, transform 1s ease 0.6s;
    }

    .ending-message.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .ending-sub {
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      color: var(--text-soft);
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 1s ease 1.2s;
      line-height: 1.7;
    }

    .ending-sub.visible {
      opacity: 1;
    }

    .ending-names {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: clamp(0.85rem, 3.2vw, 1rem);
      color: var(--sage-deep);
      letter-spacing: 0.08em;
      opacity: 0;
      transition: opacity 1s ease 1.6s;
      margin-top: 4px;
    }

    .ending-names.visible {
      opacity: 1;
    }

    .ending-names .amp {
      color: var(--gold);
      font-style: normal;
      margin: 0 6px;
    }

    /* ============================================================
       MUSIC CONTROL — corner pill
       ============================================================ */
    .music-control {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: calc(20px + env(safe-area-inset-right));
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(253, 251, 247, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50px;
      padding: 8px 16px 8px 10px;
      box-shadow: 0 6px 24px rgba(160, 150, 130, 0.22),
                  0 1px 4px rgba(160, 150, 130, 0.12);
      border: 1px solid rgba(200, 180, 140, 0.22);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
      max-width: calc(100vw - 40px);
    }

    .music-control.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .music-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--sage);
      color: var(--warm-white);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, opacity 0.25s;
      touch-action: manipulation;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }

    .music-btn:active {
      transform: scale(0.9);
    }

    .music-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .music-btn.paused {
      background: var(--beige);
      color: var(--text-soft);
    }

    .music-label {
      font-size: 0.78rem;
      color: var(--text-soft);
      letter-spacing: 0.05em;
      white-space: nowrap;
      font-weight: 500;
      transition: color 0.3s;
    }

    .music-label.playing {
      color: var(--sage-deep);
    }

    /* ============================================================
       PLAY-YOUR-SONG PROMPT
       ============================================================ */
    .song-prompt {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px);
      z-index: 1001;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(145deg, var(--warm-white), var(--cream));
      border: 1px solid var(--gold-light);
      border-radius: 50px;
      padding: 12px 22px 12px 16px;
      box-shadow: 0 12px 36px rgba(180, 160, 130, 0.28),
                  0 2px 8px rgba(180, 160, 130, 0.15);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
      border: none;
      border: 1px solid var(--gold-light);
    }

    .song-prompt.visible {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
      animation: gentlePulse 2.6s ease-in-out infinite;
    }

    .song-prompt:active {
      transform: translate(-50%, 0) scale(0.97);
    }

    .song-prompt-icon {
      font-size: 1.15rem;
      filter: drop-shadow(0 1px 3px rgba(200, 160, 100, 0.3));
    }

    @keyframes gentlePulse {
      0%, 100% { box-shadow: 0 12px 36px rgba(180, 160, 130, 0.28), 0 2px 8px rgba(180, 160, 130, 0.15); }
      50% { box-shadow: 0 12px 40px rgba(180, 160, 130, 0.42), 0 2px 10px rgba(180, 160, 130, 0.22); }
    }

    /* ============================================================
       YOUTUBE PLAYER HOST (minimal, hidden by default)
       ============================================================ */
    #youtube-host {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0.001;
      pointer-events: none;
      z-index: -1;
      border-radius: 12px;
      transition: opacity 0.4s, width 0.4s, height 0.4s;
    }

    #youtube-host.visible {
      opacity: 1;
      pointer-events: auto;
      width: 220px;
      height: 124px;
      bottom: calc(84px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(160, 150, 130, 0.3);
      border: 1px solid var(--gold-light);
      z-index: 999;
      background: #000;
    }

    #youtube-player {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ============================================================
       PARTICLES
       ============================================================ */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      will-change: transform, opacity;
    }

    .particle-heart {
      color: #d4b8b0;
      animation: floatParticle 7s linear forwards;
    }

    .particle-star {
      color: var(--gold-light);
      animation: floatParticle 8s linear forwards;
    }

    .particle-dot {
      background: var(--gold-light);
      border-radius: 50%;
      animation: floatParticle 6s linear forwards;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0;
      }
      10% {
        opacity: 0.85;
      }
      90% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(0.4);
        opacity: 0;
      }
    }

    /* ============================================================
       BALLOONS
       ============================================================ */
    .balloon {
      position: fixed;
      bottom: -140px;
      pointer-events: none;
      z-index: 4;
      animation: floatBalloon 13s ease-in-out forwards;
      will-change: transform, opacity;
    }

    .balloon-body {
      width: 100%;
      height: 80%;
      border-radius: 50% 50% 50% 50% / 42% 42% 58% 58%;
      position: relative;
      box-shadow: inset -6px -8px 16px rgba(0,0,0,0.06);
    }

    .balloon-string {
      position: absolute;
      bottom: -44px;
      left: 50%;
      width: 1px;
      height: 44px;
      background: rgba(180, 170, 150, 0.55);
      transform: translateX(-50%);
    }

    @keyframes floatBalloon {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      50% {
        transform: translateY(-55vh) translateX(24px) rotate(5deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-130vh) translateX(-16px) rotate(-4deg);
        opacity: 0;
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (min-width: 600px) {
      #scene-photos .photos-container {
        flex-direction: row;
        max-width: 620px;
        gap: 22px;
      }

      .photo-card {
        flex: 1;
      }

      .ending-photo {
        width: 160px;
      }

      .letter-paper {
        padding: 40px 36px;
      }
    }

    @media (min-width: 900px) {
      .scene {
        padding: 40px;
      }
    }

    /* ============================================================
       REDUCED MOTION
       ============================================================ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .particle,
      .balloon {
        display: none !important;
      }

      .photo-card,
      .ending-photo {
        animation: none !important;
      }

      .song-prompt.visible {
        animation: none !important;
      }

      .intro-heart {
        animation: none !important;
      }
    }

    /* ============================================================
       SCROLLBAR (letter)
       ============================================================ */
    .letter-paper::-webkit-scrollbar {
      width: 3px;
    }

    .letter-paper::-webkit-scrollbar-track {
      background: transparent;
    }

    .letter-paper::-webkit-scrollbar-thumb {
      background: var(--beige);
      border-radius: 3px;
    }
  </style>
</head>
